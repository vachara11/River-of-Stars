<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>นทีดารา : สายน้ำแห่งดวงดาว</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{--blue:#0B1E4B;--purple:#4B2E83;--gold:#D4AF37}
  html,body{font-family:'Kanit',sans-serif}
  body{background:linear-gradient(135deg,#0B1E4B 0%,#130a33 50%,#4B2E83 100%);min-height:100vh;color:#fff}
  .starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .glass{background:rgba(11,30,75,.55);backdrop-filter:blur(12px);border:1px solid rgba(212,175,55,.25)}
  .gold{color:var(--gold)} .gold-bg{background:linear-gradient(135deg,#D4AF37,#f5de93)}
  .btn-gold{background:linear-gradient(135deg,#D4AF37,#f5de93);color:#0B1E4B;font-weight:600;transition:.2s}
  .btn-gold:hover{box-shadow:0 0 22px rgba(212,175,55,.55);transform:translateY(-1px)}
  .btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{border:1px solid rgba(212,175,55,.5);color:var(--gold);transition:.2s}
  .btn-ghost:hover{background:rgba(212,175,55,.12)}
  .loader{width:38px;height:38px;border:3px solid rgba(212,175,55,.25);border-top-color:#D4AF37;border-radius:50%;animation:spin 1s linear infinite;margin:auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-in{animation:fadeIn .5s ease-out}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  input,select,textarea{color:#fff!important}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,.45)}
  input[type="number"]{color:#fff!important}
  .tab-active{background:rgba(212,175,55,.18);color:#D4AF37;border-color:#D4AF37!important}
  .badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600}
  .badge-draft{background:#475569;color:#fff}
  .badge-submitted{background:#f59e0b;color:#0B1E4B}
  .badge-approved{background:#10b981;color:#fff}
  .badge-pending{background:#f59e0b;color:#0B1E4B}
  .badge-rejected{background:#ef4444;color:#fff}
  .badge-admin{background:#D4AF37;color:#0B1E4B}
  .badge-super_admin{background:#ef4444;color:#fff}
  .badge-judge{background:#8b5cf6;color:#fff}
  .lock-overlay{opacity:.55;pointer-events:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.4);border-radius:8px}

  /* PRINT CSS */
  #printArea{display:none}
  @media print {
    body{background:#fff!important;color:#000!important}
    header,main,#toast,#modal,.starfield,#printFab{display:none!important}
    #printArea{display:block!important;background:#fff;color:#000;font-family:'Sarabun','Kanit',sans-serif;padding:0}
    #printArea *{color:#000!important}
    #printArea table{width:100%;border-collapse:collapse;margin-top:8px}
    #printArea th,#printArea td{border:1px solid #333;padding:6px 8px;font-size:11px}
    #printArea th{background:#f0f0f0!important;font-weight:700}
    #printArea .hdr{text-align:center;margin-bottom:12px;border-bottom:2px solid #333;padding-bottom:8px}
    #printArea .hdr h1{font-size:20px;margin:0}
    #printArea .hdr h2{font-size:14px;margin:4px 0;font-weight:500}
    #printArea .hdr p{font-size:11px;margin:2px 0}
    #printArea .sign{margin-top:24px;text-align:right;font-size:11px}
    #printArea .sign div{margin-top:32px}
    .page-break{page-break-after:always}
    .no-print{display:none!important}
  }
</style>
</head>
<body class="min-h-screen">
<div class="starfield" id="starfield"></div>

<header class="sticky top-0 z-30 glass">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="#home" class="flex items-center gap-3 shrink-0">
      <div class="w-10 h-10 rounded-full gold-bg flex items-center justify-center">
        <i data-lucide="sparkles" class="w-5 h-5" style="color:#0B1E4B"></i>
      </div>
      <div>
        <h1 class="text-base font-bold gold leading-tight">นทีดารา</h1>
        <p class="text-[11px] text-blue-200/70">River of Stars</p>
      </div>
    </a>
    <nav id="desktopNav" class="hidden lg:flex gap-1 text-sm"></nav>
    <div class="flex items-center gap-2">
      <div id="authArea"></div>
      <button id="menuBtn" class="lg:hidden p-2 rounded-lg hover:bg-white/10"><i data-lucide="menu" class="w-6 h-6"></i></button>
    </div>
  </div>
  <div id="mobileMenu" class="hidden lg:hidden px-4 pb-3 space-y-1 text-sm"></div>
</header>

<main class="relative z-10 max-w-7xl mx-auto px-4 py-6 pb-24">
  <section id="view-home" class="view hidden"></section>
  <section id="view-criteria" class="view hidden"></section>
  <section id="view-contestants" class="view hidden"></section>
  <section id="view-results" class="view hidden"></section>
  <section id="view-apply-noppamas" class="view hidden"></section>
  <section id="view-apply-krathong" class="view hidden"></section>
  <section id="view-login" class="view hidden"></section>
  <section id="view-judge" class="view hidden"></section>
  <section id="view-admin" class="view hidden"></section>
</main>

<div id="toast" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
<div id="modal" class="fixed inset-0 bg-black/80 hidden z-40 items-center justify-center p-4 overflow-y-auto">
  <div id="modalContent" class="max-w-4xl w-full"></div>
</div>
<div id="printArea"></div>

<script>
/* =====================================================================
   INIT SUPABASE & STATE
===================================================================== */
const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const S = {
  auth: null, judgeProfile: null,
  categories: [], contestants: [], judges: [], criteria: [],
  applications: [], news: [],
  currentCat: 'all'
};
const SK = 'nateedara_auth_v3';

/* =====================================================================
   HELPERS
===================================================================== */
function starfield(){
  const sf = document.getElementById('starfield');
  let h = '';
  for (let i=0;i<130;i++){
    const s=(Math.random()*2+0.8).toFixed(1);
    h += `<div class="star" style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${s}px;height:${s}px;animation-delay:${(Math.random()*3).toFixed(2)}s"></div>`;
  }
  sf.innerHTML = h;
}

function toast(msg, type='info'){
  const c = { info:'border-blue-400 bg-blue-500/20', success:'border-emerald-400 bg-emerald-500/20',
              error:'border-red-400 bg-red-500/20', warn:'border-yellow-400 bg-yellow-500/20' };
  const el = document.createElement('div');
  el.className = `px-4 py-3 rounded-lg glass border-l-4 ${c[type]||c.info} text-sm max-w-xs fade-in`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{ el.style.transition='.4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3000);
}

function loader0(m='กำลังโหลด...'){
  return `<div class="py-10 text-center"><div class="loader"></div><p class="text-xs text-blue-200 mt-3">${m}</p></div>`;
}

function imgTag(url, alt, cls='w-full h-56 object-cover'){
  if (!url) return `<div class="${cls} bg-slate-800/60 flex flex-col items-center justify-center text-slate-500">
      <i data-lucide="image-off" class="w-8 h-8"></i><span class="text-[11px] mt-1">ไม่มีรูป</span></div>`;
  return `<img src="${url}" alt="${alt}" class="${cls}" loading="lazy"
    onerror="this.onerror=null;this.outerHTML='&lt;div class=&quot;${cls} bg-slate-800/60 flex items-center justify-center text-slate-500 text-xs&quot;&gt;โหลดรูปไม่ได้&lt;/div&gt;'"/>`;
}

async function compress(file, maxW=1200, q=0.72){
  return new Promise((res, rej) => {
    const img = new Image(), rd = new FileReader();
    rd.onload = e => img.src = e.target.result;
    img.onload = () => {
      let w=img.width, h=img.height;
      if (w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b => b?res(b):rej(new Error('compress failed')), 'image/jpeg', q);
    };
    img.onerror = () => rej(new Error('invalid image'));
    rd.readAsDataURL(file);
  });
}

async function uploadImage(file, prefix='img'){
  const blob = await compress(file);
  const name = `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await dbClient.storage.from('contestant-images').upload(name, blob, { contentType:'image/jpeg' });
  if (error) throw error;
  return dbClient.storage.from('contestant-images').getPublicUrl(name).data.publicUrl;
}

const isAdmin = () => S.auth && ['admin','super_admin'].includes(S.auth.role);
const isJudge = () => S.auth?.role === 'judge';
const isStaff = () => isAdmin() || isJudge();
const roleLabel = r => ({admin:'ADMIN', super_admin:'SUPER ADMIN', judge:'JUDGE'}[r] || r);
const fmtDate = t => t ? new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}) : '—';
const esc = s => (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =====================================================================
   AUTH
===================================================================== */
function loadSession(){
  const raw = sessionStorage.getItem(SK);
  if (!raw) return null;
  try { const s = JSON.parse(raw); return Date.now() > s.expires ? (sessionStorage.removeItem(SK), null) : s.user; }
  catch { return null; }
}
function saveSession(u){ sessionStorage.setItem(SK, JSON.stringify({ user:u, expires: Date.now() + 8*3600*1000 })); }

async function doLogin(username, password){
  const { data, error } = await dbClient.rpc('login_user', { p_username:username, p_password:password });
  if (error) throw new Error(error.message);
  if (!data?.success) throw new Error(data?.message || 'เข้าสู่ระบบไม่สำเร็จ');
  return data.user;
}

async function refreshJudgeProfile(){
  if (S.auth?.role === 'judge' && S.auth.judge_id){
    const { data } = await dbClient.from('judges').select('*').eq('id', S.auth.judge_id).single();
    S.judgeProfile = data;
  } else S.judgeProfile = null;
}

function doLogout(){
  sessionStorage.removeItem(SK);
  S.auth = null; S.judgeProfile = null;
  renderNav(); toast('ออกจากระบบแล้ว', 'success'); nav('home');
}

/* =====================================================================
   NAV
===================================================================== */
function renderNav(){
  const base = [
    {h:'#home', l:'หน้าแรก'},
    {h:'#criteria', l:'เกณฑ์การประกวด'},
    {h:'#contestants', l:'ผู้เข้าประกวด'},
    {h:'#results', l:'ผลการตัดสิน'},
    {h:'#apply-noppamas', l:'สมัครนางนพมาศ'},
    {h:'#apply-krathong', l:'สมัครกระทง (ทีม)'}
  ];
  const links = [...base];
  if (isJudge()) links.push({h:'#judge', l:'กรอกคะแนน'});
  if (isAdmin()) links.push({h:'#admin', l:'แอดมิน'});

  document.getElementById('desktopNav').innerHTML = links.map(x =>
    `<a href="${x.h}" class="nav-btn px-2.5 py-2 rounded-lg hover:bg-white/10 whitespace-nowrap text-[13px]">${x.l}</a>`).join('');

  const mm = document.getElementById('mobileMenu');
  mm.innerHTML = links.map(x =>
    `<a href="${x.h}" class="mobile-link block px-3 py-2 rounded-lg hover:bg-white/10">${x.l}</a>`).join('');
  mm.querySelectorAll('.mobile-link').forEach(a => a.onclick = () => mm.classList.add('hidden'));

  const aa = document.getElementById('authArea');
  if (S.auth){
    aa.innerHTML = `<div class="flex items-center gap-2">
      <div class="hidden sm:block text-right">
        <p class="text-xs text-blue-100 leading-tight max-w-[140px] truncate">${esc(S.auth.full_name)}</p>
        <span class="badge badge-${S.auth.role}">${roleLabel(S.auth.role)}</span>
      </div>
      <button onclick="doLogout()" class="p-2 rounded-lg hover:bg-red-500/20 text-red-300" title="ออก">
        <i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>`;
  } else {
    aa.innerHTML = `<a href="#login" class="btn-gold px-4 py-2 rounded-full text-xs inline-flex items-center gap-1.5">
      <i data-lucide="log-in" class="w-3.5 h-3.5"></i> เข้าสู่ระบบ</a>`;
  }
  if (window.lucide) lucide.createIcons();

  const cur = '#' + (location.hash.replace('#','') || 'home');
  document.querySelectorAll('.nav-btn').forEach(a => a.classList.toggle('tab-active', a.getAttribute('href') === cur));
}

/* =====================================================================
   ROUTER
===================================================================== */
function nav(view){ if (location.hash === '#'+view) showView(view); else location.hash = '#'+view; }

function showView(name){
  if (name === 'admin' && !isAdmin()){ toast('ต้องเข้าสู่ระบบเป็นแอดมิน','error'); return nav(!S.auth?'login':'home'); }
  if (name === 'judge' && !isStaff()){ toast('ต้องเข้าสู่ระบบเป็นกรรมการ','error'); return nav(!S.auth?'login':'home'); }
  if (name === 'login' && S.auth){ return nav(isAdmin()?'admin':isJudge()?'judge':'home'); }

  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  const el = document.getElementById('view-'+name);
  if (el){ el.classList.remove('hidden'); el.classList.add('fade-in'); }
  renderNav();
  if (window.lucide) lucide.createIcons();

  const loaders = {
    home: loadHomeView, criteria: loadCriteriaView, contestants: loadContestantsView,
    results: loadResultsView, 'apply-noppamas': loadApplyNoppamas, 'apply-krathong': loadApplyKrathong,
    login: loadLoginView, judge: loadJudgeView, admin: loadAdminView
  };
  loaders[name]?.();
}

/* =====================================================================
   DATA LOADERS
===================================================================== */
async function loadBaseData(){
  const [cats, cons, judges, crit, news, apps] = await Promise.all([
    dbClient.from('categories').select('*').order('order_index'),
    dbClient.from('contestants').select('*').order('order_index'),
    dbClient.from('judges').select('*').eq('is_active', true),
    dbClient.from('criteria').select('*').order('order_index'),
    dbClient.from('news').select('*').order('created_at', { ascending:false }),
    dbClient.from('applications').select('*').order('created_at', { ascending:false })
  ]);
  S.categories = cats.data || [];
  S.contestants = cons.data || [];
  S.judges = judges.data || [];
  S.criteria = crit.data || [];
  S.news = news.data || [];
  S.applications = apps.data || [];
}

function critByCat(){
  const m = {};
  S.criteria.forEach(c => (m[c.category_id] ||= []).push(c));
  return m;
}

/* =====================================================================
   HOME VIEW (ข่าวสารประชาสัมพันธ์)
===================================================================== */
async function loadHomeView(){
  const el = document.getElementById('view-home');
  el.innerHTML = loader0();
  try {
    if (!S.news.length) await loadBaseData();
    el.innerHTML = `
      <div class="glass rounded-3xl p-8 md:p-14 text-center mb-8 fade-in">
        <p class="text-xs tracking-[0.4em] gold mb-3">✦ การประกวดกระทงและนางนพมาศ ✦</p>
        <h2 class="text-4xl md:text-6xl font-bold gold mb-3" style="text-shadow:0 0 30px rgba(212,175,55,.5)">นทีดารา</h2>
        <p class="text-lg md:text-2xl text-blue-100 mb-2">River of Stars · สายน้ำแห่งดวงดาว</p>
        <p class="text-sm text-blue-200/70 max-w-2xl mx-auto mb-6">ขอเชิญร่วมส่งผลงานประกวดกระทงและนางนพมาศ</p>
        <div class="flex flex-wrap justify-center gap-3">
          <a href="#apply-noppamas" class="btn-gold px-6 py-3 rounded-full inline-flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i> สมัครนางนพมาศ</a>
          <a href="#apply-krathong" class="btn-ghost px-6 py-3 rounded-full inline-flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> สมัครกระทง (ทีม 5 คน)</a>
        </div>
      </div>
      <div class="mb-8">
        <h3 class="text-xl font-semibold gold flex items-center gap-2 mb-4"><i data-lucide="megaphone" class="w-5 h-5"></i> ข่าวสารและประกาศประชาสัมพันธ์</h3>
        <div class="grid md:grid-cols-3 gap-4">
          ${S.news.filter(n=>n.published).map(n => `
            <div class="glass rounded-xl overflow-hidden flex flex-col">
              ${imgTag(n.image_url, n.title, 'w-full h-40 object-cover')}
              <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                  ${n.is_pinned?'<span class="text-[10px] bg-yellow-500 text-blue-900 px-2 py-0.5 rounded-full font-semibold mb-2 inline-block">ปักหมุด</span>':''}
                  <h4 class="font-semibold text-sm text-gold">${esc(n.title)}</h4>
                  <p class="text-xs text-blue-200/80 mt-2 line-clamp-4 leading-relaxed">${esc(n.content||'')}</p>
                </div>
                <p class="text-[10px] text-blue-200/50 mt-4">${fmtDate(n.created_at)}</p>
              </div>
            </div>`).join('') || `<p class="col-span-3 text-center text-blue-200/60 py-8 text-sm glass rounded-xl">ยังไม่มีข่าวสารในขณะนี้</p>`}
        </div>
      </div>`;
    if (window.lucide) lucide.createIcons();
  } catch(e){ el.innerHTML = `<p class="text-red-300">${esc(e.message)}</p>`; }
}

/* =====================================================================
   CRITERIA ( public )
===================================================================== */
async function loadCriteriaView(){
  const el = document.getElementById('view-criteria');
  el.innerHTML = loader0();
  try {
    if (!S.criteria.length) await loadBaseData();
    const map = critByCat();
    el.innerHTML = `
      <h2 class="text-2xl font-bold gold mb-4 flex items-center gap-2"><i data-lucide="list-checks" class="w-6 h-6"></i> เกณฑ์การประกวด</h2>
      <div class="grid md:grid-cols-2 gap-4">
        ${S.categories.map(cat => {
          const list = map[cat.id] || [];
          return `
            <div class="glass rounded-2xl p-5 fade-in">
              <h3 class="gold font-semibold mb-3 flex items-center gap-2 text-lg"><i data-lucide="award" class="w-5 h-5"></i> ${esc(cat.name)}</h3>
              ${list.length ? `
              <table class="w-full text-sm">
                <thead><tr class="text-blue-200/70 text-left border-b border-white/10">
                  <th class="py-2">รายการเกณฑ์</th><th class="py-2 text-center w-20">สัดส่วน</th><th class="py-2 text-center w-20">คะแนนเต็ม</th>
                </tr></thead>
                <tbody>
                  ${list.map(cr => `<tr class="border-b border-white/5">
                    <td class="py-2">${esc(cr.name)}</td>
                    <td class="text-center gold font-medium">${cr.weight}%</td>
                    <td class="text-center text-blue-200/70">${cr.max_score}</td>
                  </tr>`).join('')}
                </tbody>
              </table>` : '<p class="text-xs text-blue-200/60 py-3">ยังไม่มีข้อมูลเกณฑ์</p>'}
            </div>`;
        }).join('') || `<p class="text-blue-200/60 col-span-2 text-center py-6">ยังไม่มีเกณฑ์การประกวด</p>`}
      </div>`;
    if (window.lucide) lucide.createIcons();
  } catch(e){ el.innerHTML = `<p class="text-red-300">${esc(e.message)}</p>`; }
}

/* =====================================================================
   CONTESTANTS ( public )
===================================================================== */
async function loadContestantsView(){
  const el = document.getElementById('view-contestants');
  el.innerHTML = loader0();
  try {
    if (!S.contestants.length) await loadBaseData();
    const filter = `
      <div class="flex flex-wrap gap-2 mb-4">
        <button data-c="all" class="cfilter px-3.5 py-1.5 rounded-full text-xs border ${S.currentCat==='all'?'tab-active':'border-white/20'}">ทั้งหมด</button>
        ${S.categories.map(c=>`<button data-c="${c.id}" class="cfilter px-3.5 py-1.5 rounded-full text-xs border ${S.currentCat===c.id?'tab-active':'border-white/20'}">${esc(c.name)}</button>`).join('')}
      </div>`;
    const list = S.currentCat==='all' ? S.contestants : S.contestants.filter(c=>c.category_id===S.currentCat);
    el.innerHTML = `<h2 class="text-2xl font-bold gold mb-4 flex items-center gap-2"><i data-lucide="users" class="w-6 h-6"></i> รายชื่อผู้เข้าประกวด</h2>${filter}
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${list.map(c => {
          const cat = S.categories.find(x=>x.id===c.category_id);
          const mem = Array.isArray(c.members) ? c.members : [];
          return `<div class="glass rounded-2xl overflow-hidden">
            <div class="relative">${imgTag(c.image_url, c.name, 'w-full h-52 object-cover')}
              <div class="absolute top-2 left-2 gold-bg text-blue-900 font-bold rounded-full w-9 h-9 flex items-center justify-center text-sm shadow">${c.contestant_no}</div>
            </div>
            <div class="p-4">
              <p class="text-[10px] gold font-semibold uppercase">${esc(cat?.name||'')}</p>

   RESULTS ( public / Admin preview )
===================================================================== */
async function computeResults(onlyApproved=true){
  if (!S.contestants.length) await loadBaseData();
  const { data: scores } = await dbClient.from('scores').select('*');
  const map = critByCat();
  const useScores = (scores||[]).filter(s => onlyApproved ? s.is_approved : true);
  return S.contestants.map(c => {
    const crit = map[c.category_id] || [];
    let total = 0, wsum = 0;
    crit.forEach(cr => {
      const vals = useScores.filter(s=>s.contestant_id===c.id && s.criteria_id===cr.id).map(s=>Number(s.score)||0);
      if (vals.length){
        const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
        total += (avg / Number(cr.max_score)) * Number(cr.weight);
        wsum += Number(cr.weight);
      }
    });
    return { ...c, total: wsum>0 ? (total / wsum) * 100 : 0, catName: S.categories.find(x=>x.id===c.category_id)?.name };
  });
}

async function handleApply(ev, type){
  ev.preventDefault();
  const form = ev.target;
  const fd = new FormData(form);
  const btn = form.querySelector('button[type="submit"]');
  const status = document.getElementById('applyImgStatus');
  btn.disabled = true; btn.textContent = 'กำลังส่งข้อมูล...';
  try {
    let image_url = null;
    const file = document.getElementById('applyImg').files[0];
    if (file){
      status.textContent = '⏳ กำลังอัปโหลด รูปภาพ...';
      image_url = await uploadImage(file, 'app');
      status.textContent = '✅ อัปโหลดสำเร็จ';
    }
    let payload = {
      type, phone: fd.get('phone'), email: fd.get('email'),
      branch: fd.get('branch'), image_url, description: fd.get('description')
    };
    if (type === 'noppamas'){
      payload.full_name = fd.get('full_name');
      payload.student_id = fd.get('student_id');
    } else {
      payload.team_name = fd.get('team_name');
      payload.level = fd.get('level');
      payload.room = fd.get('room');
      const members = [];
      for (let i=0;i<5;i++){
        const nm = fd.get(`member_name_${i}`);
        if (nm) members.push({ name:nm, student_id: fd.get(`member_sid_${i}`) || null });
      }
      payload.members = members;
    }
    const { error } = await dbClient.from('applications').insert(payload);
    if (error) throw error;
    
    // เปลี่ยนเป้นข้อความสำเร็จพร้อมปุ่ม ปริ้นใบสมัคร
    form.parentNode.innerHTML = `
      <div class="text-center py-8 fade-in">
        <i data-lucide="check-circle-2" class="w-16 h-16 mx-auto text-emerald-400 mb-4"></i>
        <h3 class="text-2xl font-bold gold mb-2">ส่งใบสมัครเรียบร้อยแล้ว!</h3>
        <p class="text-sm text-blue-200/80 mb-6 max-w-md mx-auto">ระบบบันทึกใบสมัครของท่านเรียบร้อยแล้ว ท่านสามารถกดพิมพ์ใบสมัครเพื่อเก็บไว้เป็นหลักฐานได้</p>
        <div class="flex justify-center gap-3 flex-wrap">
          <button type="button" id="printUserReceiptBtn" class="btn-gold px-6 py-2.5 rounded-lg flex items-center gap-2">
            <i data-lucide="printer" class="w-4 h-4"></i> ปริ้นใบสมัคร
          </button>
          <button type="button" onclick="nav('home')" class="btn-ghost px-6 py-2.5 rounded-lg">กลับสู่หน้าแรก</button>
        </div>
      </div>
    `;
    if (window.lucide) lucide.createIcons();
    
    document.getElementById('printUserReceiptBtn').onclick = () => printApplicantReceipt(payload);
    toast('ส่งใบสมัครสำเร็จ!', 'success');
  } catch (e){
    toast('เกิดข้อผิดพลาด: ' + e.message, 'error');
    btn.disabled = false; btn.textContent = 'ส่งใบสมัคร';
  }
}

async function renderScoreTable(catId, box){
  const judgeId = S.judgeProfile.id;
  const crit = S.criteria.filter(c => c.category_id === catId);
  const cons = S.contestants.filter(c => c.category_id === catId);
  const { data: subs } = await dbClient.from('judge_submissions').select('*').eq('judge_id', judgeId).eq('category_id', catId).maybeSingle();
  const status = subs?.status || 'draft';
  const locked = status !== 'draft';
  const { data: scores } = await dbClient.from('scores').select('*').eq('judge_id', judgeId);
  const mapScores = {};
  (scores||[]).forEach(s => mapScores[`${s.contestant_id}|${s.criteria_id}`] = Number(s.score));

  if (!crit.length || !cons.length){
    box.innerHTML = `<p class="text-center text-blue-200/60 py-8 text-sm">ยังไม่มีข้อมูลเกณฑ์หรือผู้เข้าประกวดในหมวดนี้</p>`;
    return;
  }

  box.innerHTML = `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xs text-blue-200">สถานะการส่งคะแนน:</span>
        <span class="badge badge-${status}">${status.toUpperCase()}</span>
      </div>
      <div class="flex gap-2">
        ${!locked ? `<button id="jSubmitBtn" class="btn-gold px-4 py-1.5 rounded-lg text-xs flex items-center gap-1.5"><i data-lucide="send" class="w-3.5 h-3.5"></i> ยืนยันส่งคะแนน</button>` : ''}
        <button id="jRefreshBtn" class="btn-ghost px-3 py-1.5 rounded-lg text-xs">🔄 รีเฟรช</button>
      </div>
    </div>
    <div class="overflow-x-auto ${locked?'lock-overlay':''}">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-blue-200/70 border-b border-white/10">
          <th class="py-2 pr-3 min-w-[150px]">ผู้เข้าประกวด</th>
          ${crit.map(c=>`<th class="py-2 px-1 text-center whitespace-nowrap text-[11px]">
            ${esc(c.name)}<br><span class="text-[10px] gold">ถ่วง ${c.weight}% (เต็ม ${c.max_score})</span>
          </th>`).join('')}
          <th class="py-2 px-1 text-center font-bold text-gold">รวม % (เรียลไทม์)</th>
        </tr></thead>
        <tbody>
          ${cons.map(ct=>`
            <tr class="border-b border-white/5">
              <td class="py-2.5 pr-3">
                <span class="text-gold font-bold">#${ct.contestant_no}</span> ${esc(ct.name)}
                <div class="text-[10px] text-blue-200/60">${esc(ct.affiliation||'')}</div>
              </td>
              ${crit.map(cr => {
                const v = mapScores[`${ct.id}|${cr.id}`];
                return `<td class="py-1 px-1 text-center">
                  <input type="number" min="0" max="${cr.max_score}" step="0.5" value="${v??''}"
                    data-ct="${ct.id}" data-cr="${cr.id}" data-max="${cr.max_score}"
                    oninput="onJudgeInput(this)"
                    class="w-16 text-center bg-white/10 rounded px-1.5 py-1 border border-white/20 text-sm font-semibold" ${locked?'disabled':''}/>
                </td>`;
              }).join('')}
              <td class="py-1 px-1 text-center gold font-bold text-base" id="row-total-${ct.id}">—</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="text-xs text-blue-200/60 mt-3">💡 ระบบบันทึกคะแนนอัตโนมัติ และสรุปผลคำนวณคะแนนรวมเป็นเปอร์เซ็นต์ให้อัตโนมัติแบบเรียลไทม์</p>`;

  cons.forEach(ct => recalcRowTotal(ct.id, crit));

  const timers = {};
  window.onJudgeInput = (input) => {
    const key = `${input.dataset.ct}|${input.dataset.cr}`;
    clearTimeout(timers[key]);
    timers[key] = setTimeout(async () => {
      const val = Number(input.value) || 0;
      try {
        await dbClient.from('scores').upsert({
          judge_id: judgeId, contestant_id: input.dataset.ct, criteria_id: input.dataset.cr, score: val
        }, { onConflict: 'judge_id,contestant_id,criteria_id' });
        mapScores[key] = val;
        recalcRowTotal(input.dataset.ct, crit);
      } catch(e){ toast('บันทึกคะแนนไม่สำเร็จ','error'); }
    }, 400);
  };

  const submitBtn = document.getElementById('jSubmitBtn');
  if (submitBtn) submitBtn.onclick = async () => {
    if (!confirm('ยืนยันส่งคะแนน? เมื่อส่งแล้วจะไม่สามารถแก้ไขคะแนนได้อีกจนกว่าแอดมินจะปลดล็อก')) return;
    submitBtn.disabled = true; submitBtn.textContent = 'กำลังส่งคะแนน...';
    try {
      const { data, error } = await dbClient.rpc('submit_judge_scores', { p_judge_id: judgeId, p_category_id: catId });
      if (error) throw error;
      if (!data?.success) throw new Error(data?.message);
      toast('ส่งคะแนนเรียบร้อยแล้ว!', 'success');
      renderScoreTable(catId, box);
    } catch(e){ toast(e.message, 'error'); submitBtn.disabled = false; submitBtn.textContent = 'ส่งคะแนน'; }
  };
  document.getElementById('jRefreshBtn').onclick = () => renderScoreTable(catId, box);
  if (window.lucide) lucide.createIcons();
}

function recalcRowTotal(contestantId, crit){
  const el = document.getElementById('row-total-'+contestantId);
  if (!el) return;
  let total = 0, wsum = 0;
  crit.forEach(cr => {
    const inp = document.querySelector(`input[data-ct="${contestantId}"][data-cr="${cr.id}"]`);
    if (inp && inp.value !== ''){
      total += (Number(inp.value)/Number(cr.max_score)) * Number(cr.weight);
      wsum += Number(cr.weight);
    }
  });
  el.textContent = wsum > 0 ? ((total/wsum)*100).toFixed(2) : '—';
}

  f.title.focus(); window.scrollTo({top:0, behavior:'smooth'});

async function approveApp(id, btn){

async function rejectApp(id, btn){
  const reason = prompt('ระบุเหตุผลในการปฏิเสธใบสมัคร:');
  if (reason === null) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    const { error } = await dbClient.rpc('reject_application', { p_id:id, p_admin:S.auth.username, p_reason:reason });
    if (error) throw error;
    toast('ปฏิเสธใบสมัครแล้ว', 'success');
    adminApplications(document.getElementById('aContent'));
  } catch(e){ toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'ปฏิเสธ'; }
}

function doPrint(html, landscape=false){
  const pa = document.getElementById('printArea');
  pa.innerHTML = html;
  let style = document.getElementById('printPageStyle');
  if (!style){ style = document.createElement('style'); style.id = 'printPageStyle'; document.head.appendChild(style); }
  style.textContent = `@page { size: A4 ${landscape?'landscape':'portrait'}; margin: 12mm; }`;
  setTimeout(() => window.print(), 200);
}

}

/* 1. ใบคะแนนเปล่าสำหรับเขียนมือ (แนวนอน) */
async function printBlankSheet(){
  const catId = document.getElementById('printCat').value;
  const cat = S.categories.find(c=>c.id===catId);
  const crit = S.criteria.filter(c=>c.category_id===catId).sort((a,b)=>a.order_index-b.order_index);
  const cons = S.contestants.filter(c=>c.category_id===catId).sort((a,b)=>a.contestant_no-b.contestant_no);
  if (!crit.length || !cons.length){ toast('ไม่มีข้อมูลผู้ประกวดหรือเกณฑ์การตัดสิน','warn'); return; }

  const html = `${printHeader('ใบคะแนนการตัดสิน (สำหรับเขียนด้วยมือ)', `ประเภท: ${cat.name}`)}

      <span>วันที่: _____ / _____ / _____</span>
      <span>ลงชื่อ: ___________________________________</span>
    </div>
    <table>
      <thead><tr>
        <th style="width:50px">หมายเลข</th><th style="width:180px">ชื่อผู้เข้าประกวด / สังกัด</th>
        ${crit.map(c=>`<th style="text-align:center">${esc(c.name)}<br><small>(${c.weight}% / เต็ม ${c.max_score})</small></th>`).join('')}
        <th style="width:70px;text-align:center">คะแนนรวม</th>
      </tr></thead>
      <tbody>
        ${cons.map(ct=>`<tr style="height:38px">
          <td style="text-align:center;font-weight:700">${ct.contestant_no}</td>
          <td>${esc(ct.name)}<br><small>${esc(ct.affiliation||'')}</small></td>

/* 2. พิมพ์คะแนนแยกตามกรรมการ */
async function printJudgeScores(){
  const catId = document.getElementById('printCat').value;
  const judgeId = document.getElementById('printJudgeSel').value;
  const cat = S.categories.find(c=>c.id===catId);
  const judge = S.judges.find(j=>j.id===judgeId);
  const crit = S.criteria.filter(c=>c.category_id===catId).sort((a,b)=>a.order_index-b.order_index);
  const cons = S.contestants.filter(c=>c.category_id===catId).sort((a,b)=>a.contestant_no-b.contestant_no);
  if (!crit.length || !cons.length){ toast('ไม่มีข้อมูล','warn'); return; }
  const { data: scores } = await dbClient.from('scores').select('*').eq('judge_id', judgeId);
  const map = {};
  (scores||[]).forEach(s => map[`${s.contestant_id}|${s.criteria_id}`] = Number(s.score));

  const html = `${printHeader('สรุปใบคะแนนการตัดสิน (รายกรรมการ)', `ประเภท: ${cat.name} · กรรมการ: ${judge?.name}`)}
    <table>
      <thead><tr>
        <th style="width:50px">หมายเลข</th><th style="width:160px">ชื่อผู้เข้าประกวด</th>
        ${crit.map(c=>`<th style="text-align:center">${esc(c.name)}<br><small>${c.weight}% / ${c.max_score}</small></th>`).join('')}
        <th style="text-align:center;width:70px">รวม %</th>
      </tr></thead>
      <tbody>
        ${cons.map(ct=>{
          let total=0, wsum=0;
          const cells = crit.map(cr=>{
            const v = map[`${ct.id}|${cr.id}`];
            if (v != null){ total += (v/Number(cr.max_score))*Number(cr.weight); wsum += Number(cr.weight); }
            return `<td style="text-align:center">${v ?? '-'}</td>`;
          }).join('');
          const pct = wsum>0 ? ((total/wsum)*100).toFixed(2) : '-';
          return `<tr><td style="text-align:center;font-weight:700">${ct.contestant_no}</td>
            <td>${esc(ct.name)}</td>${cells}<td style="text-align:center;font-weight:700">${pct}</td></tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="sign">
      <div>ลงชื่อ ___________________________</div>
      <div>(${esc(judge?.name||'')})</div>
      <div>กรรมการผู้ให้คะแนน</div>
    </div>`;
  doPrint(html, false);
}

/* 3. พิมพ์คะแนนรวมกรรมการ (Cross-tab) */
async function printCrossTab(){
  const catId = document.getElementById('printCat').value;
  const cat = S.categories.find(c=>c.id===catId);
  const cons = S.contestants.filter(c=>c.category_id===catId).sort((a,b)=>a.contestant_no-b.contestant_no);
  const crit = S.criteria.filter(c=>c.category_id===catId);
  const { data: scores } = await dbClient.from('scores').select('*').eq('is_approved', true);
  const useJudges = S.judges.filter(j => (scores||[]).some(s => s.judge_id === j.id));
  if (!cons.length){ toast('ไม่มีข้อมูลผู้เข้าประกวด','warn'); return; }

  const calc = (judgeId, ctId) => {
    let total=0, wsum=0;
    crit.forEach(cr=>{
      const s = (scores||[]).find(x=>x.judge_id===judgeId && x.contestant_id===ctId && x.criteria_id===cr.id);
      if (s){ total += (Number(s.score)/Number(cr.max_score))*Number(cr.weight); wsum += Number(cr.weight); }
    });
    return wsum>0 ? (total/wsum)*100 : null;
  };

  const html = `${printHeader('ตารางสรุปคะแนนรวมจากคณะกรรมการทั้งหมด (Cross-Tab)', `ประเภท: ${cat.name}`)}
    <table>
      <thead><tr>
        <th style="width:50px">หมายเลข</th><th style="width:160px">ชื่อผู้เข้าประกวด</th>
        ${useJudges.map(j=>`<th style="text-align:center">${esc(j.name.split(' ')[0])}</th>`).join('')}
        <th style="text-align:center;width:80px">คะแนนเฉลี่ย</th>
      </tr></thead>
      <tbody>
        ${cons.map(ct=>{
          const vals = useJudges.map(j=>calc(j.id, ct.id));
          const valid = vals.filter(v=>v!=null);
          const avg = valid.length ? (valid.reduce((a,b)=>a+b,0)/valid.length) : 0;
          return `<tr>
            <td style="text-align:center;font-weight:700">${ct.contestant_no}</td>
            <td>${esc(ct.name)}</td>
            ${vals.map(v=>`<td style="text-align:center">${v!=null?v.toFixed(2):'-'}</td>`).join('')}
            <td style="text-align:center;font-weight:700">${avg.toFixed(2)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="sign">
      <div>ลงชื่อ ___________________________</div>
      <div>ประธานกรรมการ / ผู้ตรวจสอบคะแนน</div>
    </div>`;
  doPrint(html, false);
}

/* 4. พิมพ์ผลการแข่งขันตามลำดับ */
async function printRankings(){
  const catId = document.getElementById('printCat').value;
  const cat = S.categories.find(c=>c.id===catId);
  const results = (await computeResults(true)).filter(r=>r.category_id===catId).sort((a,b)=>b.total-a.total);
  if (!results.length){ toast('ไม่มีข้อมูลคะแนน','warn'); return; }
  const html = `${printHeader('ประกาศผลการแข่งขัน (ตามลำดับคะแนน)', `ประเภท: ${cat.name}`)}
    <table>
      <thead><tr>
        <th style="width:70px;text-align:center">อันดับ</th>
        <th style="width:70px;text-align:center">หมายเลข</th>
        <th>ชื่อผู้ประกวด / ทีม</th><th>สังกัด / สาขาวิชา</th>
        <th style="text-align:center;width:90px">คะแนนรวม</th>
      </tr></thead>
      <tbody>
        ${results.map((r,i)=>`<tr style="height:32px">
          <td style="text-align:center;font-weight:700;font-size:13px">${['🥇 ชนะเลิศ','🥈 รองอันดับ 1','🥉 รองอันดับ 2'][i] || `อันดับ ${i+1}`}</td>
          <td style="text-align:center;font-weight:700">${r.contestant_no}</td>
          <td><b>${esc(r.name)}</b></td>
          <td>${esc(r.affiliation||'')}</td>
          <td style="text-align:center;font-weight:700">${r.total.toFixed(2)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="sign">
      <div>ลงชื่อ ___________________________</div>
      <div>ประธานคณะกรรมการการตัดสิน</div>
    </div>`;
  doPrint(html, false);
}

/* 5. พิมพ์ใบสมัครจากระบบแอดมิน */
async function printApplication(appId){
  const a = S.applications.find(x=>x.id===appId) || (await dbClient.from('applications').select('*').eq('id', appId).single()).data;
  if (!a){ toast('ไม่พบใบสมัคร','error'); return; }
  printApplicantReceipt(a);
}
